name: Database

# Migrations and the ZAO seed run themselves when a PR that touches them merges to main
# (or by hand from the Actions tab). Zaal, 3 Nov 2026: "we need to find the best way for
# you to run sqls". Three secrets, set once in the Production environment, never at repo
# level (once that environment has Zaal as required reviewer and main-only deployment
# branches, no job reaches them without his approval):
#   SUPABASE_DB_URL             Postgres connection string (Project settings > Database, session pooler)
#   NEXT_PUBLIC_SUPABASE_URL    the project URL (same value Vercel has)
#   SUPABASE_SERVICE_ROLE_KEY   the service-role key (same value Vercel has)
# Without SUPABASE_DB_URL (or, for the seed, SUPABASE_SERVICE_ROLE_KEY) the job lists
# the pending migrations and FAILS red, so a run that applied nothing never shows green.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/seed-*.mjs"
      - "scripts/db-migrate.sh"
      - ".github/workflows/db.yml"
  workflow_dispatch:
    inputs:
      seed:
        description: "Run the ZAO seed (scripts/seed-zao-projects.mjs) after migrating"
        type: boolean
        default: true

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrate-and-seed:
    runs-on: ubuntu-latest
    # The secrets below belong in this environment only. Once the Production environment has
    # Zaal as required reviewer and main-only deployment branches, no job runs with them until
    # he approves it, and then a branch copy of this file cannot reach them.
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Migrate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            # Fail red, not green: on 4 Nov this exited 0 and the run showed success while
            # nothing was applied (0 secrets in the Production environment).
            echo "::error::SUPABASE_DB_URL secret not set in the Production environment: nothing applied. Pending files:"; ls supabase/migrations; exit 1
          fi
          bash scripts/db-migrate.sh
      - name: Install (seed needs @supabase/supabase-js)
        if: ${{ github.event_name == 'push' || inputs.seed }}
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Seed the ZAO Sparks (safe to re-run, existing slugs are kept)
        if: ${{ github.event_name == 'push' || inputs.seed }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY secret not set in the Production environment: seed not run"; exit 1; fi
          node scripts/seed-zao-projects.mjs
