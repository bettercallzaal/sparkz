<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparkz</title>
<style>
  html, body { height: 100%; margin: 0; background: #0a0908; color: #f5f5f5; font-family: system-ui, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  p { margin: 0; opacity: .7; font-size: 15px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ffd700; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(.7); opacity: .5 } 50% { transform: scale(1); opacity: 1 } }
</style>

<main>
  <div class="dot"></div>
